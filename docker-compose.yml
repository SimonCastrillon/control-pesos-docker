services:
  db:
    image: postgres:16-alpine            # imagen oficial, versión fija
    env_file: .env                       # usuario, clave y nombre de la BD
    volumes:
      - datos_pg:/var/lib/postgresql/data  # los datos sobreviven al contenedor
    networks:
      - red-app
    healthcheck:                         # "sano" = Postgres acepta conexiones
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Sin "ports": la BD solo es accesible dentro de red-app

  api:
    build: ./api
    env_file: .env
    environment:
      DB_HOST: db                        # nombre del servicio, no localhost
      DB_PORT: "5432"
    ports:
      - "8000:8000"                      # acceso desde tu PC
    networks:
      - red-app
    depends_on:
      db:
        condition: service_healthy       # espera a que Postgres esté listo

networks:
  red-app:
    name: red-app                        # nombre fijo para "docker network inspect red-app"

volumes:
  datos_pg: